# CI (r1-fixes, run-owner ruling 2026-09-16): the push path runs the suite
# and nothing timing-sensitive. The D18 read-path tripwire is the separate
# manual job below, so no push pays an npm install of the pinned baseline,
# and the SPEC keeps that tripwire as the first RC checklist step regardless.
#
# Every push runs every check from a clean build, in about four minutes
# (ci-speed D5, operator ruling 2026-11-17: efficient, and no money spent).
# Standard runners cost nothing on a public repository, but a free
# organisation runs at most 20 jobs at once (5 on macOS), so a push starts 19
# and none queues. What does not fit four minutes — SofarCore's four slices
# under fat LTO and the release-profile cores — runs nightly, on pull
# requests, and at every release tag (release.yml).
name: ci

on:
  push:
    # rust-core (rust-core 3.2): the native core's build matrix and the
    # mixed-install conformance job must run on the branch that carries them —
    # dispatch needs the workflow on the default branch, which main lacks
    # until the merge.
    branches: [main, rust-core]
  pull_request:
  schedule:
    # Nightly on main (ci-speed 3.3): the full Apple build and the release cores.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'previous release to gate against (npm version of sofar.sh)'
        required: true
        default: '0.34.1'

# Many sessions push record-only commits to main; a newer push supersedes the
# run of an older one instead of queueing behind it. Keyed by event too, so a
# push never cancels the nightly run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The engine suite on the supported floor AND the current runtime (rust-core
  # D37): package.json declares node >=18, and the conformance goldens are
  # runtime-neutral (the harness masks V8's JSON.parse position suffix), so
  # both must stay green. Four parts a runtime (ci-speed 2.1): vitest deals
  # files to shards by path hash, not duration, so the two slowest files
  # (links-tier, conformance: 55–115 s each on a runner) share a part of their
  # own, and the rest split three ways.
  test:
    name: test (${{ matrix.node }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        part: [heavy, 1/3, 2/3, 3/3]
    runs-on: ubuntu-latest
    # The suite runs in minutes. A sync loop no vitest timeout can interrupt
    # (the /proc mkdir hang, 2026-09-21) otherwise holds the job to GitHub's 6 h cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The unit project only: the shim-latency pin (speed T2) is wall-clock on
      # the machine it runs on, and the push path runs nothing timing-sensitive
      # (the header's ruling) — a hosted runner's SessionStart floor sits above
      # the 100 ms budget. `npm test` locally still runs it; perf needs SOFAR_PERF.
      - name: vitest (${{ matrix.part }})
        env:
          PART: ${{ matrix.part }}
          HEAVY: packages/engine/test/links-tier.test.ts,packages/engine/test/conformance/conformance.test.ts
        run: |
          if [ "$PART" = heavy ]; then
            npx vitest run --project unit ${HEAVY//,/ }
          else
            SOFAR_TEST_EXCLUDE="$HEAVY" npx vitest run --project unit --shard="$PART"
          fi
      - run: npm run typecheck
        if: matrix.part == '1/3'

  # The native core (rust-core 3.2): every platform sofar.sh ships a core for,
  # tested where the runner can run it. x86_64-apple-darwin builds on the arm
  # runner and its tests run under Rosetta (ci-speed 2.3): the Intel runner
  # took 7–17 min. A release builds and attests its own cores at the tag
  # (release.yml, r4-fixes E2, M16); the nightly run proves the release profile
  # still builds, and a dispatch uploads it for the by-hand fallback
  # (packaging/npm/README.md).
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the exact channel; this only installs it.
          toolchain: 1.98.1
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      # The schema generator in lockstep with packages/schema/src: platform-
      # independent, so one row runs it.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask schema --check
      # The owned logarithm (rust-core D33): js_log against the TypeScript
      # fdlibmLog, bit for bit. Same packages as the suite, so the second
      # cargo call reuses its build instead of compiling again (ci-speed 1.3).
      # The suite includes render_parity: the Rust render of every real log.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node crates/sofar-core/tests/js_log_pairs.mjs > "$RUNNER_TEMP/js-log-pairs.txt"
        shell: bash
      - name: cargo test, then js_log against the TypeScript fdlibmLog
        shell: bash
        run: |
          cargo test -p sofar-core -p sofar-ffi --target ${{ matrix.target }}
          SOFAR_JS_LOG_PAIRS="$RUNNER_TEMP/js-log-pairs.txt" cargo test -p sofar-core -p sofar-ffi --target ${{ matrix.target }} --test js_log_crosscheck -- --ignored
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo build --release -p sofar-core --target ${{ matrix.target }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sofar-core-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/sofar-core
            target/${{ matrix.target }}/release/sofar-core.exe
          if-no-files-found: error

  # SofarCore (rust-core 5.2, D53): the xcframework and its Swift tests folding
  # this checkout's own record through it. A push builds the macOS arm64 slice
  # without LTO (ci-speed 2.4); the nightly run, a pull request and a dispatch
  # build all four as released. Xcode 26 (swift-tools 6.2, the iOS 26 SDK) is
  # macos-26's.
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.event_name == 'push' && 'host' || 'all' }}
      - if: github.event_name == 'push'
        env:
          CARGO_PROFILE_FFI_LTO: 'false'
          CARGO_PROFILE_FFI_CODEGEN_UNITS: '16'
        run: crates/sofar-ffi/build-apple.sh --test --host
      - if: github.event_name != 'push'
        run: crates/sofar-ffi/build-apple.sh --test

  # The mixed install and the record (one runner, ci-speed 3.4):
  # - release invariants (r4-fixes 0.1, U2): sofar.sh's version is >= the
  #   newest v* tag, and every optionalDependency is @sofar.sh/core-*;
  # - the packaging generator in lockstep with its sources;
  # - (rust-core 3.1, D31) the shipped boot stub dispatching to the core it
  #   built, every conformance case, no tag skipped;
  # - (rust-core 5.1) the core's fold deep-equal to TypeScript's on every real
  #   events.jsonl of this repository, every branch tip included — so full
  #   history, every branch as origin/*. sofar-cloud's logs are private, so
  #   they are proved in its own CI.
  # Its core is the `ci` profile's: release without fat LTO (ci-speed 1.2).
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node packaging/npm/release-guard.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
      - run: npm ci
      - run: npm run build
      - run: node packaging/npm/emit.mjs --check
      - run: cargo build --profile ci -p sofar-core
      - run: SOFAR_CORE=$PWD/target/ci/sofar-core npx vitest run --project unit packages/engine/test/conformance/conformance.test.ts
      - run: SOFAR_CONFORMANCE_BIN=$PWD/target/ci/sofar-core npx vitest run --project unit packages/engine/test/conformance/fold-parity packages/engine/test/conformance/real-logs

  # r3-fixes 4.0: every record of this repository through BOTH engines — fold,
  # every hook's stdout/stderr/exit, status, statusline and the bytes written —
  # compared byte for byte (scripts/parity-real.mjs), dealt across four
  # runners by log size (ci-speed 2.2).
  parity-real:
    name: parity-real (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: 'false'
      - run: npm ci
      - run: npm run build
      - run: cargo build --profile ci -p sofar-core
      - run: npm run parity:real -- --core target/ci/sofar-core --shard ${{ matrix.shard }}/4 --jobs 4

  # Loose read-path tripwire (r1-fixes D18): a gross regression cannot reach
  # an RC unnoticed. Wide budget on purpose — hosted noise cannot hide a 2×
  # regression, and the ±10% gate runs by hand, interleaved, per the SPEC.
  # Per ENGINE (r4-fixes U8): the bench pins SOFAR_CORE on both sides and
  # times each leg like with like through the hook shims hosts run, and
  # refuses (exit 4) when the two sides ran different engines — the 0.34.0
  # cut timed the npm baseline's native core against this checkout's
  # TypeScript and read +70–79%. macOS runs both legs: the baseline's
  # platform package against the core built here. Linux runs the TypeScript
  # leg only.
  read-paths:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, legs: 'ts,native' }
          - { os: ubuntu-latest, legs: ts }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The candidate's core, which the bench finds at target/release (a
      # checkout's own build, never the published package npm ci installs).
      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.legs, 'native')
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        if: contains(matrix.legs, 'native')
      - run: cargo build --release -p sofar-core
        if: contains(matrix.legs, 'native')
      # Its platform package carries the baseline's core (the native leg).
      - name: install the pinned baseline
        run: npm install --prefix "$RUNNER_TEMP/baseline" sofar.sh@${{ inputs.baseline }}
      - name: read-path tripwire (repo fixture)
        run: |
          npm run bench:read-paths -- \
            --baseline "$RUNNER_TEMP/baseline/node_modules/sofar.sh/dist/cli.js" \
            --candidate packages/engine/dist/cli.js --legs ${{ matrix.legs }} \
            --fixture repo --session ci-tripwire --n 25 --budget 0.5 \
            --record "$RUNNER_TEMP/read-paths.repo.json"
      - name: read-path tripwire (i1000-10mb fixture)
        run: |
          npm run bench:read-paths -- \
            --baseline "$RUNNER_TEMP/baseline/node_modules/sofar.sh/dist/cli.js" \
            --candidate packages/engine/dist/cli.js --legs ${{ matrix.legs }} \
            --fixture i1000-10mb --n 25 --budget 0.5 \
            --record "$RUNNER_TEMP/read-paths.i1000-10mb.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-paths-${{ matrix.os }}
          path: ${{ runner.temp }}/read-paths.*.json
