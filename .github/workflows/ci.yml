# CI (r1-fixes, run-owner ruling 2026-09-16): the push path runs the suite
# and nothing timing-sensitive. The D18 read-path tripwire is the separate
# manual job below, so no push pays an npm install of the pinned baseline,
# and the SPEC keeps that tripwire as the first RC checklist step regardless.
name: ci

on:
  push:
    # rust-core (rust-core 3.2): the native core's build matrix and the
    # mixed-install conformance job must run on the branch that carries them —
    # dispatch needs the workflow on the default branch, which main lacks
    # until the merge.
    branches: [main, rust-core]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'previous release to gate against (npm version of sofar.sh)'
        required: true
        default: '0.34.0'

# Many sessions push record-only commits to main; a newer push supersedes the
# run of an older one instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine suite on the supported floor AND the current runtime (rust-core
  # D37): package.json declares node >=18, and the conformance goldens are
  # runtime-neutral (the harness masks V8's JSON.parse position suffix), so
  # both must stay green.
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    # The suite runs in minutes. A sync loop no vitest timeout can interrupt
    # (the /proc mkdir hang, 2026-09-21) otherwise holds the job to GitHub's 6 h cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The unit project only: the shim-latency pin (speed T2) is wall-clock on
      # the machine it runs on, and the push path runs nothing timing-sensitive
      # (the header's ruling) — a hosted runner's SessionStart floor sits above
      # the 100 ms budget. `npm test` locally still runs it; perf needs SOFAR_PERF.
      - run: npx vitest run --project unit
      - run: npm run typecheck

  # The native core (rust-core 3.2): one build per platform sofar.sh ships a
  # core for, tested where the runner can run it, and uploaded as the
  # artifact `packaging/npm/emit.mjs --binaries` stages into the platform
  # packages. Publishing stays a human step (repo memory M1): download the
  # `sofar-core-*` artifacts, run the emit script, `npm publish` each
  # platform package, then sofar.sh — the optionalDependencies pin them at
  # the release version, so the order matters.
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the exact channel; this only installs it.
          toolchain: 1.98.1
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test -p sofar-core --target ${{ matrix.target }}
      # The owned logarithm (rust-core D33): js_log against the TypeScript
      # fdlibmLog, bit for bit, on every target the core is built for.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: js_log against the TypeScript fdlibmLog
        shell: bash
        run: |
          node crates/sofar-core/tests/js_log_pairs.mjs > "$RUNNER_TEMP/js-log-pairs.txt"
          SOFAR_JS_LOG_PAIRS="$RUNNER_TEMP/js-log-pairs.txt" cargo test -p sofar-core --target ${{ matrix.target }} --test js_log_crosscheck -- --ignored
      - run: cargo build --release -p sofar-core --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sofar-core-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/sofar-core
            target/${{ matrix.target }}/release/sofar-core.exe
          if-no-files-found: error

  # The mixed install (rust-core 3.1, D31): the shipped boot stub dispatching
  # to the core it just built, every conformance case, no tag skipped; plus
  # the schema and packaging generators kept in lockstep with their sources.
  core-conformance:
    runs-on: ubuntu-24.04
    steps:
      # Every branch as origin/*: the real-log gate (rust-core 5.1) folds
      # every branch tip's logs, not just this commit's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo xtask schema --check
      - run: node packaging/npm/emit.mjs --check
      - run: cargo build --release -p sofar-core
      - run: SOFAR_CORE=$PWD/target/release/sofar-core npx vitest run --project unit packages/engine/test/conformance/conformance.test.ts
      - run: SOFAR_CONFORMANCE_BIN=$PWD/target/release/sofar-core npx vitest run --project unit packages/engine/test/conformance/fold-parity
      - run: cargo test -p sofar-core --test render_parity
      # rust-core 5.1: the core's fold deep-equals TypeScript's on every real
      # events.jsonl of this repository, every branch tip included. sofar-cloud's
      # logs are private, so they are proved in its own CI, never here.
      - run: SOFAR_CONFORMANCE_BIN=$PWD/target/release/sofar-core npx vitest run --project unit packages/engine/test/conformance/real-logs
      # r3-fixes 4.0: every record of this repository through BOTH engines —
      # fold, every hook's stdout/stderr/exit, status, statusline and the
      # bytes written — compared byte for byte (scripts/parity-real.mjs).
      - run: npm run parity:real

  # Loose read-path tripwire (r1-fixes D18): a gross regression cannot reach
  # an RC unnoticed. Wide budget on purpose — hosted noise cannot hide a 2×
  # regression, and the ±10% gate runs by hand, interleaved, per the SPEC.
  # Per ENGINE (r4-fixes U8): the bench pins SOFAR_CORE on both sides and
  # times each leg like with like through the hook shims hosts run, and
  # refuses (exit 4) when the two sides ran different engines — the 0.34.0
  # cut timed the npm baseline's native core against this checkout's
  # TypeScript and read +70–79%. macOS runs both legs: the baseline's
  # platform package against the core built here. Linux runs the TypeScript
  # leg only.
  read-paths:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, legs: 'ts,native' }
          - { os: ubuntu-latest, legs: ts }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The candidate's core, which the bench finds at target/release (a
      # checkout's own build, never the published package npm ci installs).
      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.legs, 'native')
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        if: contains(matrix.legs, 'native')
      - run: cargo build --release -p sofar-core
        if: contains(matrix.legs, 'native')
      # Its platform package carries the baseline's core (the native leg).
      - name: install the pinned baseline
        run: npm install --prefix "$RUNNER_TEMP/baseline" sofar.sh@${{ inputs.baseline }}
      - name: read-path tripwire (repo fixture)
        run: |
          npm run bench:read-paths -- \
            --baseline "$RUNNER_TEMP/baseline/node_modules/sofar.sh/dist/cli.js" \
            --candidate packages/engine/dist/cli.js --legs ${{ matrix.legs }} \
            --fixture repo --session ci-tripwire --n 25 --budget 0.5 \
            --record "$RUNNER_TEMP/read-paths.repo.json"
      - name: read-path tripwire (i1000-10mb fixture)
        run: |
          npm run bench:read-paths -- \
            --baseline "$RUNNER_TEMP/baseline/node_modules/sofar.sh/dist/cli.js" \
            --candidate packages/engine/dist/cli.js --legs ${{ matrix.legs }} \
            --fixture i1000-10mb --n 25 --budget 0.5 \
            --record "$RUNNER_TEMP/read-paths.i1000-10mb.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-paths-${{ matrix.os }}
          path: ${{ runner.temp }}/read-paths.*.json
